<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solarmind Audit Pro</title><meta name="theme-color" content="#0e7c86"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#14181c;--mut:#5d6872;--line:#e4e7ea;--ac:#0e7c86;--ac2:#e4f3f4;--am:#e08a00;--red:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1215;--card:#161b1f;--ink:#e9edf0;--mut:#93a0ab;--line:#262d33;--ac:#3fb8c4;--ac2:#14343a}}
:root[data-theme="dark"]{--bg:#0e1215;--card:#161b1f;--ink:#e9edf0;--mut:#93a0ab;--line:#262d33;--ac:#3fb8c4;--ac2:#14343a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;display:flex;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
aside{width:236px;flex:none;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.logo{background:#fff;border-radius:14px;padding:8px;margin-bottom:12px;text-align:center;border:1px solid var(--line)}.logo img{width:100%;max-width:170px;display:block;margin:auto}
nav{display:flex;flex-direction:column;gap:4px}
nav button{margin:0;text-align:left;background:none;color:var(--mut);padding:11px 14px}nav button:hover{background:var(--bg)}nav button.lock{opacity:.45}nav button.on{background:var(--ac2);color:var(--ac)}
#th{margin-top:auto;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
main{flex:1;min-width:0;max-width:1240px;margin:0 auto;padding:28px 32px}
.cols{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}h3{margin:0 0 6px;font-size:17px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px;color:var(--mut)}
input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}input:focus,select:focus{outline:2px solid var(--ac)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--ink)}.chk input{width:18px;height:18px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#fff;width:100%;margin-top:14px;cursor:pointer}button:hover{filter:brightness(1.08)}
button.sec{background:var(--ac2);color:var(--ac)}button.del{width:auto;padding:6px 12px;margin:0;background:none;color:var(--red);border:1px solid var(--line)}
.eq{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:11px 0}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--am);color:#fff;margin-left:6px}
.big{font-size:24px;font-weight:700;color:var(--ac)}.warn{color:var(--am);font-weight:700}.hide{display:none}
.tip{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--ac2);color:var(--ac);font-size:11px;font-weight:700;margin-left:7px;cursor:help}
.tip::after{content:attr(data-tip);position:absolute;left:-8px;bottom:135%;width:250px;padding:9px 11px;border-radius:8px;background:#14181c;color:#fff;font-weight:400;font-size:12.5px;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .15s;z-index:30;text-align:left}.tip:hover::after{opacity:1}
.np{display:flex;gap:10px;align-items:center;max-width:900px;margin:0 auto 16px}.np button{width:auto;margin:0}.np b{margin-right:auto}
#rep{background:#fff;color:#14181c;padding:36px;border-radius:14px;border:1px solid var(--line);max-width:900px;margin:auto;font-size:13.5px}
#rep h1{font-size:24px;margin:8px 0 4px}#rep h2{font-size:16px;color:var(--rep);border-bottom:2px solid var(--rep);padding-bottom:4px;margin:24px 0 10px}
#rep .hd{border-bottom:3px solid #f5c542;padding-bottom:10px;margin-bottom:10px}#rep td{padding:6px;border-bottom:1px solid #e4e7ea;vertical-align:top}table{width:100%;border-collapse:collapse}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.kpi div{border:1px solid #e4e7ea;border-radius:10px;padding:8px 10px;color:#5d6872;font-size:12px}.kpi b{display:block;font-size:16px;color:#14181c}
.bar{height:14px;border-radius:4px}
@media(max-width:860px){body{flex-direction:column}aside{width:auto;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap}nav{flex-direction:row}.logo{margin:0}.logo img{max-width:80px}#th{margin:0;width:auto}.cols{grid-template-columns:1fr}main{padding:14px}.kpi{grid-template-columns:1fr 1fr}#rep{padding:16px}}
@media print{aside,.np{display:none!important}body{display:block;background:#fff}main{padding:0}#rep{border:0;padding:0}}
</style>
<style id="ov">:root{--rep:#0e7c86}main{max-width:1040px}
aside svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside{width:244px;transition:width .2s;padding:14px 12px;gap:4px}aside.min{width:72px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.lg{width:42px;height:42px;flex:none;background:#fff;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;padding:3px}.lg img{width:100%}
.bt b{display:block;line-height:1.15}.bt small{color:var(--mut);font-size:12px}
.sl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut);padding:12px 8px 4px}
aside nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border-left:3px solid transparent;font-size:14px}
aside nav button.on{background:var(--ac2);color:var(--ac);border-left-color:var(--ac)}aside nav button span{flex:1}
aside nav button i{font-style:normal;font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--mut)}aside nav button.on i{background:var(--ac);color:#fff}
.foot{margin-top:auto;display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.foot button,#th{margin:0;padding:10px;background:var(--bg);color:var(--mut);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;width:auto}
#col{flex:1}#th{width:42px}.foot button:hover{color:var(--ink)}
aside.min .bt,aside.min .sl,aside.min nav span,aside.min nav i,aside.min #col span{display:none}
aside.min nav button{justify-content:center;padding:11px}aside.min .brand{justify-content:center;padding-inline:0}aside.min .foot{flex-direction:column}aside.min #th{width:auto}aside.min #col svg{transform:rotate(180deg)}
.sc{display:grid;gap:14px 16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.f label{margin-top:0}.card h3{margin-bottom:14px}
.sw{display:flex;gap:12px;flex-wrap:wrap}.sw button{width:36px;height:36px;border-radius:50%;margin:0;padding:0;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}.sw button.on{box-shadow:0 0 0 2px var(--ink)}
#go{width:auto;padding:12px 24px;margin:0}button.sec{width:auto;margin:0;padding:12px 20px}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}.sl,#col,aside nav button i{display:none}aside.min{width:auto}.brand{border:0;padding:0;margin:0}.foot{margin:0 0 0 auto;border:0;padding:0}}
#rep .evg{display:grid;gap:12px;margin-bottom:8px}#rep .ev{border:1px solid #e4e7ea;border-radius:10px;overflow:hidden;break-inside:avoid;page-break-inside:avoid}#rep .ev>div:last-child{padding:10px}#rep .sev{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-height:84px;resize:vertical}
</style></head>

let S={tab:"cfg",cfg:{negocio:"",consultor:"Ronald Orozco Gonzalez",tipo:TIPOS[0],kwh:0,consumo:0,reactiva:0,capex:0,base:"opt",hsp:4.5,pr:80},eq:[],ev:[]};
try{const r=localStorage.getItem("sm_audit");if(r){const p=JSON.parse(r);S.cfg=Object.assign(S.cfg,p.cfg||{});S.eq=p.eq||[];S.ev=p.ev||[]}}catch(e){}
if(S.cfg.capex==4800000)S.cfg.capex=0;
const save=()=>{try{localStorage.setItem("sm_audit",JSON.stringify({cfg:S.cfg,eq:S.eq,ev:S.ev}))}catch(e){}};
const $=s=>document.querySelector(s), n=v=>Number(v)||0;
const cop=v=>"$"+Math.round(v).toLocaleString("es-CO")+" COP";
const f1=v=>v.toLocaleString("es-CO",{maximumFractionDigits:1,minimumFractionDigits:1});

function calc(){
  let cat={},tot=0,stby=0,aisl=0;CAT.forEach(c=>cat[c]=0);
  S.eq.forEach(e=>{
    const kw=e.unit==="W"?e.p/1000:e.unit==="HP"?e.p*0.746:e.p;
    const fpOn=(e.cat===CAT[0]||e.cat===CAT[2]||e.cat===CAT[4]);
    const eff=kw*e.qty/(fpOn?(e.fp||0.9):1);
    const on=eff*e.h*e.d;
    const off=e.stby?eff*0.05*Math.max(0,24-e.h)*e.d:0;
    let k=on+off;
    if(e.stby)stby+=off;
    if(e.aisl){aisl+=k*0.2;k*=1.2}
    cat[e.cat]+=k;tot+=k;
  });
  const t=n(S.cfg.kwh),real=n(S.cfg.consumo),gap=real-tot;
  return{cat,tot,stby,aisl,t,real,gap,gapCOP:Math.max(0,gap)*t,total:real*t+n(S.cfg.reactiva)};
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>{b.classList.toggle("on",b.dataset.t===S.tab);b.classList.toggle("lock",b.dataset.t!==S.tab&&errs(b.dataset.t).length>0)});
  $("#app").innerHTML=S.tab==="cfg"?vCfg():S.tab==="cen"?vCen():S.tab==="evi"?vEvi():S.tab==="set"?vSet():vRep();
  if(S.tab==="cfg")bindCfg();if(S.tab==="cen")bindCen();if(S.tab==="rep")bindRep();if(S.tab==="set")bindSet();if(S.tab==="evi")bindEvi();addTips();
}
function errs(t){const c=S.cfg,e=[];if(t!=="cfg"&&t!=="set"){if(!c.negocio.trim())e.push("Nombre del negocio");if(!c.consultor.trim())e.push("Nombre del consultor");if(n(c.kwh)<50||n(c.kwh)>5000)e.push("Valor del kWh (entre 50 y 5.000 COP)");if(n(c.consumo)<=0)e.push("Consumo mensual facturado (kWh)");if(n(c.reactiva)<0)e.push("Penalidad por reactiva (no puede ser negativa)");if(n(c.hsp)<3||n(c.hsp)>7)e.push("Horas sol pico (entre 3 y 7)");if(n(c.pr)<50||n(c.pr)>95)e.push("Factor de rendimiento (entre 50% y 95%)")}if(t==="rep"&&!S.eq.length)e.push("Al menos un equipo en el censo de carga");return e}
function note(m){let b=$("#msg");if(!b){b=document.createElement("div");b.id="msg";b.className="card";b.style.cssText="border-color:var(--am);color:var(--am);font-weight:600";$("#app").prepend(b)}b.textContent=m;scrollTo(0,0)}
function go(t){const e=errs(t);if(e.length){note("Para continuar completa o corrige: "+e.join(", ")+".");return}S.tab=t;render();scrollTo(0,0)}

function vCfg(){return`<div class="card"><h3>Datos del cliente</h3><div class="sc g3">${F("Nombre del negocio","negocio",{})}${F("Consultor","consultor",{})}${F("Tipo de negocio","tipo",{sel:TIPOS.map(t=>[t,t])})}</div></div>

function plan(r){
  const L=[],has=f=>S.eq.some(f);
  if(has(e=>e.aisl))L.push("Aislamiento deficiente en climatización/refrigeración: instalar cierra-puertas, sellar fugas térmicas y revisar empaques.");
  if(has(e=>e.stby))L.push("Consumo fantasma: instalar regletas o temporizadores y desconectar equipos fuera de horario.");
  if(has(e=>e.cat===CAT[2]))L.push("Fuerza motriz/resistencia: consolidar ciclos de uso para evitar picos de arranque.");
  if(has(e=>e.cat===CAT[0]))L.push("Climatización: programar termostatos en 24 °C y mantenimiento preventivo de filtros.");
  if(has(e=>e.cat===CAT[3]))L.push("Iluminación: migrar a LED y usar sensores de presencia.");if(has(e=>e.cat===CAT[4]))L.push("Herramientas menores: centralizar su uso por turnos, desconectarlas al terminar la jornada y priorizar equipos eficientes (motor sin escobillas); así se evitan picos de arranque y consumo en vacío.");if(has(e=>e.cat===CAT[5]))L.push("Cómputo y electrónica: activar suspensión automática, usar regletas con interruptor y apagar monitores y cargadores fuera de horario.");
  if(n(S.cfg.reactiva)>0)L.push("Penalidad por reactiva: evaluar banco de condensadores para corregir el factor de potencia.");
  if(r.gap>0)L.push("Desfase operativo: verificar equipos no censados y fugas de consumo; repetir medición con analizador de red.");
  const T={"Taller Automotriz":"Escalonar el arranque de compresores, soldadoras y elevadores; evitar su uso simultáneo.","Hotel":"Instalar tarjeteros de habitación y programar el agua caliente fuera de horas pico.","Clínica/Estética":"Mantener la cadena de frío con registro de temperaturas y apagar equipos de consulta no usados.","Comercio":"Ajustar la iluminación de vitrinas por franjas y tapar las neveras abiertas en horas de baja afluencia."};
  (REC[S.cfg.tipo]||REC["Comercio"]).forEach(x=>L.push(x));return L;
}

const TIPS={tipo:"Define las recomendaciones específicas del informe.",kwh:"Costo unitario real de la factura (COP/kWh), idealmente energía + comercialización + distribución. Es la base de todo el dinero perdido.",consumo:"kWh facturados en el mes típico. Usa el promedio de 3 a 6 facturas si hay variación.",reactiva:"Valor cobrado por energía reactiva en la factura. Si no hay cobro, deja 0.",base:"Consumo con el que se calcula el sistema. Recomendado: facturado menos el ahorro del plan de choque, para no sobredimensionar.",hsp:"Horas equivalentes de sol pleno al día en el sitio del cliente. Promedio nacional cercano a 4,5; ajústalo por ciudad.",pr:"Rendimiento real del sistema tras pérdidas por temperatura, suciedad, cableado e inversor. Típico 75% a 85%.",capex:"Déjalo vacío para usar la tabla de referencia por tamaño, o escribe tu cotización real. Precio por kWp instalado (paneles, inversor, estructura e instalación). Solo se usa para estimar inversión y retorno. Ajústalo a tu cotización real.",cat:"Agrupa el consumo en el gráfico. El factor de potencia se aplica a climatización, fuerza motriz y herramientas menores. Pulidoras, taladros y similares van en Herramientas menores.",p:"Potencia de placa. 1 HP = 0,746 kW. En aires, usa la potencia eléctrica, no la térmica (BTU o toneladas).",u:"Conversión automática a kW: W ÷ 1000 y HP × 0,746.",q:"Número de equipos idénticos con el mismo uso.",fp:"Típico 0,85 a 0,95 en motores y compresores. Un FP bajo aumenta el consumo aparente y la reactiva.",h:"Horas reales de funcionamiento por día, no horas de apertura del negocio.",d:"Días de uso al mes (máximo 31).",sb:"Equipos que siguen energizados fuera de uso. Se asume 5% de la potencia nominal durante las horas apagadas.",ai:"Fugas por puertas abiertas, empaques dañados o falta de aislamiento. Aplica +20% al consumo del equipo."};

function ekwh(e){const kw=e.unit==="W"?e.p/1000:e.unit==="HP"?e.p*0.746:e.p;const eff=kw*e.qty/((e.cat===CAT[0]||e.cat===CAT[2]||e.cat===CAT[4])?(e.fp||0.9):1);const off=e.stby?eff*0.05*Math.max(0,24-e.h)*e.d:0;let k=eff*e.h*e.d+off,a=0;if(e.aisl){a=k*0.2;k*=1.2}return{k,a,s:off,kw:kw*e.qty}}
const TIERS=[[5,4500000,"hasta 5 kWp"],[10,4200000,"5 a 10 kWp"],[30,3900000,"10 a 30 kWp"],[100,3400000,"30 a 100 kWp"],[1e9,3000000,"más de 100 kWp"]];

function an(){const r=calc(),t=r.t,c=S.cfg;const sA=r.aisl*t,sS=r.stby*t,sT=r.cat[CAT[0]]*0.08*t,sR=n(c.reactiva),low=sA+sS+sR,high=low+sT;const yk=n(c.hsp)*30*n(c.pr)/100,kA=r.aisl+r.stby+r.cat[CAT[0]]*0.08,bs=c.base==="teo"?r.tot:c.base==="fact"?r.real:Math.max(0,r.real-kA),kwp=yk>0?bs/yk:0,gen=kwp*yk,sav=Math.min(gen,r.real)*t,tier=costo(kwp),cpk=n(c.capex)>0?n(c.capex):tier.v,inv=kwp*cpk;
return{yk,bs,cpk,tier,sA,sS,sT,sR,low,high,pl:r.total?low/r.total*100:0,ph:r.total?high/r.total*100:0,kwp,inv,sav,pay:sav>0?inv/(sav*12):0,cov:r.real?Math.min(gen,r.real)/r.real*100:0,co2:gen*12*0.126/1000,kw:S.eq.reduce((x,e)=>x+ekwh(e).kw,0)}}
function hallazgos(r){const L=[],A=S.eq;
A.filter(e=>e.aisl).forEach(e=>{const x=ekwh(e);L.push(`<b>Pérdida de aislamiento térmico:</b> ${e.name} trabaja en sobreesfuerzo por fugas térmicas (puertas abiertas, empaques o cerramientos). Sobreconsumo de ${f1(x.a)} kWh/mes (${cop(x.a*r.t)}).`)});
A.filter(e=>e.cat===CAT[2]).forEach(e=>L.push(`<b>Subutilización de cargas resistivas/motrices:</b> ${e.name} (${e.h} h/día). El uso fraccionado multiplica los picos de arranque y el gasto de resistencia térmica.`));
A.filter(e=>e.stby).forEach(e=>{const x=ekwh(e);L.push(`<b>Consumo en stand-by:</b> ${e.name} permanece energizado en horas no operativas: ${f1(x.s)} kWh/mes (${cop(x.s*r.t)}).`)});
if(n(S.cfg.reactiva)>0)L.push(`<b>Energía reactiva:</b> penalidad de ${cop(S.cfg.reactiva)} al mes (${f1(r.total?n(S.cfg.reactiva)/r.total*100:0)}% de la factura); indica bajo factor de potencia en motores y compresores.`);
L.push(r.gap>0?`<b>Desfase operativo:</b> el consumo facturado supera al teórico en ${f1(r.gap)} kWh/mes (${f1(r.real?r.gap/r.real*100:0)}%), equivalente a ${cop(r.gapCOP)}. Sugiere cargas no censadas, horarios subestimados o equipos degradados.`:`<b>Desfase operativo:</b> el consumo teórico iguala o supera al facturado (${f1(-r.gap)} kWh). Conviene validar horas y días de uso declarados.`);
return L}
function vRep(){
const r=calc(),c=S.cfg,A=an(),mx=Math.max(1,...Object.values(r.cat)),fecha=new Date().toLocaleDateString("es-CO"),pc=x=>r.tot?f1(x/r.tot*100):"0,0";
const rank=S.eq.map(e=>({e,k:ekwh(e).k})).sort((a,b)=>b.k-a.k).slice(0,5);
const K=(a,b)=>`<div>${a}<b>${b}</b></div>`;
return`<div class="np card"><b>Previsualización del informe</b><button id="pdf">Descargar PDF</button><button class="sec" id="prt">Imprimir</button></div>
<div id="rep"><div class="hd"><img src="${LOGO}" style="height:84px"><h1>Informe de Eficiencia Energética</h1><div style="color:#5d6872">Cliente: <b>${c.negocio||"Sin nombre"}</b> · ${c.tipo}<br>Consultor: <b>${c.consultor}</b> - Solarmind Ingeniería · ${fecha}</div></div>
<h2>1. Resumen Ejecutivo</h2>
<p>El consumo actual de las instalaciones es de aproximadamente <b>${f1(r.real)} kWh/mes</b>, generando un gasto de <b>${cop(r.total)}</b>. La carga térmica (climatización) representa el <b>${pc(r.cat[CAT[0]])}%</b> del consumo identificado. Se han detectado fugas operativas que permiten una reducción del <b>${f1(A.pl)}% al ${f1(A.ph)}%</b> del costo mensual (${cop(A.low)} a ${cop(A.high)}) con acciones inmediatas y baja o nula inversión.</p>
<div class="kpi">${K("Consumo facturado",f1(r.real)+" kWh")}${K("Gasto mensual",cop(r.total))}${K("Costo efectivo por kWh",cop(r.real?r.total/r.real:0))}${K("Cobertura del censo",f1(r.real?r.tot/r.real*100:0)+"%")}${K("Potencia instalada",f1(A.kw)+" kW")}${K("Consumo teórico diario",f1(r.tot/30)+" kWh")}${K("Gasto anual proyectado",cop(r.total*12))}${K("Ahorro anual estimado",cop(A.low*12)+" a "+cop(A.high*12))}</div>
<h2>2. Diagnóstico de consumo</h2>${donut(r)}
${CAT.map((k,i)=>`<div style="margin:6px 0"><small>${k}: ${f1(r.cat[k])} kWh (${pc(r.cat[k])}%) · ${cop(r.cat[k]*r.t)}</small><div class="bar" style="width:${r.cat[k]/mx*100}%;background:${COLS[i]}"></div></div>`).join("")}
${rank.length?`<p><b>Mayores consumidores</b></p><table>${rank.map(x=>`<tr><td>${x.e.qty}× ${x.e.name}</td><td>${f1(x.k)} kWh</td><td>${pc(x.k)}%</td><td>${cop(x.k*r.t)}</td></tr>`).join("")}</table>`:""}
<p>Consumo teórico: <b>${f1(r.tot)} kWh</b> · Consumo real: <b>${f1(r.real)} kWh</b> · Desfase: <b>${f1(r.gap)} kWh</b>.</p>
<h2>3. Hallazgos y fugas de energía identificadas</h2><ul>${hallazgos(r).map(x=>`<li>${x}</li>`).join("")}</ul>
<table><tr><td>Mal aislamiento térmico</td><td><b>${f1(r.aisl)} kWh</b></td><td><b>${cop(A.sA)}</b>/mes</td></tr>
<tr><td>Consumo fantasma (stand-by)</td><td><b>${f1(r.stby)} kWh</b></td><td><b>${cop(A.sS)}</b>/mes</td></tr>
<tr><td>Desfase operativo (real − teórico)</td><td><b>${f1(r.gap)} kWh</b></td><td><b>${cop(r.gapCOP)}</b>/mes</td></tr>
<tr><td>Penalidad por reactiva</td><td>—</td><td><b>${cop(A.sR)}</b>/mes</td></tr></table>
<p class="warn" style="color:#e08a00">Dinero perdido estimado: ${cop(A.sA+A.sS+r.gapCOP+A.sR)} al mes (${cop((A.sA+A.sS+r.gapCOP+A.sR)*12)} al año).</p>
${evSec()}<h2>4. Plan de choque</h2><ul>${plan(r).map(x=>`<li>${x}</li>`).join("")}</ul>
<table><tr><td><b>Medida</b></td><td><b>Ahorro mensual</b></td><td><b>Inversión</b></td></tr>
<tr><td>Sellar fugas térmicas y cierra-puertas</td><td>${cop(A.sA)}</td><td>Baja</td></tr>
<tr><td>Eliminar stand-by (regletas/temporizadores)</td><td>${cop(A.sS)}</td><td>Baja</td></tr>
<tr><td>Termostatos a 24 °C (≈8% de climatización)</td><td>${cop(A.sT)}</td><td>Nula</td></tr>
<tr><td>Corrección de factor de potencia</td><td>${cop(A.sR)}</td><td>Media</td></tr>
<tr><td><b>Total</b></td><td><b>${cop(A.low)} a ${cop(A.high)}</b></td><td></td></tr></table>
<h2>5. Proyección a energía solar</h2>
<p>Con un consumo base optimizado de <b>${f1(A.bs)} kWh</b>, su negocio es viable para autogeneración. Solarmind Ingeniería recomienda un sistema fotovoltaico On-Grid estimado de <b>${f1(A.kwp)} kWp</b> de potencia instalada para independizar su operación.</p>
<table><tr><td>Generación estimada (${f1(A.yk)} kWh/kWp-mes: ${S.cfg.hsp} h sol pico × 30 × ${S.cfg.pr}%)</td><td><b>${f1(A.kwp*A.yk)} kWh/mes</b></td></tr><tr><td>Cobertura de la factura</td><td><b>${f1(A.cov)}%</b></td></tr><tr><td>Inversión estimada (${cop(A.cpk)}/kWp, ${n(S.cfg.capex)>0?"cotización":"referencia de mercado "+A.tier.l})</td><td><b>${cop(A.inv)}</b></td></tr><tr><td>Ahorro mensual por autogeneración</td><td><b>${cop(A.sav)}</b></td></tr><tr><td>Retorno simple de la inversión</td><td><b>${A.pay?f1(A.pay)+" años":"—"}</b></td></tr><tr><td>CO₂ evitado al año</td><td><b>${f1(A.co2)} t</b></td></tr></table>
<h2>6. Conclusiones y siguientes pasos</h2><ol><li>Ejecutar las medidas inmediatas del plan de choque.</li><li>Medir 30 días con analizador de red para validar el desfase y el factor de potencia.</li><li>Dimensionar en detalle el sistema fotovoltaico tras optimizar la carga.</li></ol>
${anexo()}
<p style="color:#5d6872;font-size:11px;margin-top:18px"><b>Supuestos:</b> 1 HP = 0,746 kW; stand-by 5% de la potencia nominal; aislamiento deficiente ×1,20; FP aplicado a climatización y fuerza motriz; ahorro por termostato 8%; generación según horas sol pico y rendimiento indicados; costo por kWp de referencia de mercado Colombia 2026 (no es cotización); factor de emisión referencial 0,126 kg CO₂/kWh. Valores estimados sujetos a verificación en sitio.</p>
<p style="margin-top:28px">______________________________<br><b>${c.consultor}</b><br>Consultor · Solarmind Ingeniería<br>${[U.tel,U.mail,U.ciudad].filter(Boolean).join(" · ")}</p></div>`}
function bindRep(){
  $("#pdf").onclick=()=>{
    if(!window.html2pdf){note("No se cargó el generador PDF. Usa Imprimir y elige Guardar como PDF.");return}
    html2pdf().set({margin:8,filename:"Auditoria_"+(S.cfg.negocio||"Solarmind").replace(/\s+/g,"_")+".pdf",html2canvas:{scale:2},jsPDF:{unit:"mm",format:"a4"}}).from($("#rep")).save();
  };
  $("#prt").onclick=()=>print();
}
$("#logo").src=LOGO;
const ICO={sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>',moon:'<svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>'};

let th=null;try{th=localStorage.getItem("sm_theme")}catch(e){}
setTheme(th||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("#th").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("#col").onclick=()=>{U.min=!U.min;saveU();applyUI()};
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js?v=3")}catch(e){}
render();
